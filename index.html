<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미국 증시 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Apple Calendar month view: hairline grid, dates top-right, red circle for today, inspector sidebar on the right.
   Korean market colors: red = up, blue = down. */
:root {
  --bg: #ffffff;
  --side: #f5f5f7;
  --card: #ffffff;
  --fg: #1d1d1f;
  --muted: #86868b;
  --faint: #c7c7cc;
  --line: #e5e5ea;
  --weekend: #fafafa;
  --other: #f5f5f7;
  --today: #ff3b30;
  --sel: #e8f0fe;
  --up: #e5322d;
  --up-soft: #fdecea;
  --down: #2a6df4;
  --down-soft: #e8effe;
  --flat: #8e8e93;
  --flat-soft: #f0f0f2;
  --earn: #8e44c9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e; --side: #232325; --card: #2c2c2e; --fg: #f5f5f7; --muted: #98989d; --faint: #545458;
    --line: #38383a; --weekend: #202022; --other: #19191a; --today: #ff453a; --sel: #1f3350;
    --up: #ff5b52; --up-soft: #3a2220; --down: #4d8dff; --down-soft: #1d2a45; --flat: #98989d; --flat-soft: #333336; --earn: #c08af2;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
/* Desktop: calendar and market flow on the left, the selected day's sidebar spanning the right.
   Narrow screens stack calendar → selected day → market flow, so a tapped date's details sit right under the grid. */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; grid-template-areas: "month side" "flow side"; min-height: 100%; }
.month { grid-area: month; }
.side { grid-area: side; }
.flow { grid-area: flow; align-self: start; }

/* Month view */
.month { display: flex; flex-direction: column; min-width: 0; align-self: start; }
.bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); }
.titles { display: grid; gap: 4px; }
h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
h1 span { font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--card); }
.seg button { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 0; padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--side); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--down); outline-offset: -2px; }
.dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.dows div { text-align: right; padding: 0 10px 6px; font-size: 12px; color: var(--muted); }
.dows .sun { color: var(--today); } .dows .sat { color: var(--down); }
/* Rows size to their content (date + tag + three indices) instead of stretching to the sidebar's height. */
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(112px, auto); border-bottom: 1px solid var(--line); }
.cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 6px 8px; min-width: 0;
  display: flex; flex-direction: column; gap: 3px; cursor: default; background: var(--bg); text-align: left; font: inherit; color: inherit; border-top: 0; border-left: 0; }
.cell:nth-child(7n) { border-right: 0; }
.cell.wkend { background: var(--weekend); }
.cell.other { background: var(--other); }
.cell.has { cursor: pointer; }
/* Status tag on the left, day number on the right, sharing one baseline row. */
.chead { display: flex; align-items: center; gap: 4px; min-width: 0; margin-bottom: 2px; }
.dnum { flex: none; margin-left: auto; font-size: 15px; font-weight: 600; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.cell.sun .dnum { color: var(--today); } .cell.sat .dnum { color: var(--down); }
.cell.other .dnum { color: var(--faint); }
.cell.today .dnum { background: var(--today); color: #fff; font-weight: 600; }
.tag { min-width: 0; font-size: 13px; line-height: 28px; font-weight: 600; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag.flat, .tag.closed { color: var(--muted); }
.ev { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.35; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; min-width: 0; }
.ev .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
.ev .lbl { flex: none; }
.ev .val { margin-left: auto; font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.cell.sel .ev { background: var(--sel); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--down); }
.cell.other .ev, .cell.other .tag { opacity: 0.55; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.bg-up { background: var(--up); } .bg-down { background: var(--down); } .bg-flat { background: var(--flat); } .bg-earn { background: var(--earn); }
.earn { color: var(--earn); }
.ev.earn { margin-top: 2px; }
.ev.earn .lbl { font-weight: 600; }
.ev.earn .enames { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.elist { display: grid; }
.erow { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.erow:first-child { border-top: 0; padding-top: 0; }
.etop { display: flex; align-items: baseline; gap: 6px; }
.etop b { font-weight: 600; font-size: 14.5px; }
.etk { font-size: 11.5px; color: var(--muted); }
.ewhat, .ewhen { font-size: 12.5px; color: var(--muted); }
.eres { font-size: 13px; margin-top: 2px; }

/* Inspector */
.side { background: var(--side); border-left: 1px solid var(--line); padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.card { background: var(--card); border-radius: 12px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 0 0 1px var(--line); }
.kicker { font-size: 13px; font-weight: 600; }
.ctitle { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.cdate { font-size: 13px; color: var(--muted); }
.plain { margin: 2px 0 0; font-size: 15.5px; line-height: 1.6; font-weight: 500; text-wrap: pretty; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.points li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 13.5px; line-height: 1.55; }
.points .ic { font-size: 13px; line-height: 1.55; text-align: center; color: var(--muted); }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row .n { display: grid; gap: 1px; }
.row .s { font-size: 11.5px; color: var(--muted); }
.row .c { color: var(--muted); }
.row .p { font-weight: 600; min-width: 64px; text-align: right; }
.note { font-size: 13px; line-height: 1.55; margin: 0; }
.news { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.nhead { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.nhead i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.news .points .ic { font-weight: 700; }
.news .points .ic.up { color: var(--up); } .news .points .ic.down { color: var(--down); }
.news b { font-weight: 600; display: block; }
.nnote { display: block; color: var(--muted); }
.src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }
.ndot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); display: inline-block; margin-left: 4px; vertical-align: 2px; }
.sect { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px -12px; }
.list { display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: 4px 1fr; gap: 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; background: transparent; border: 0; font: inherit; color: inherit; text-align: left; }
.item:hover, .item.on { background: var(--card); }
.item .stripe { border-radius: 2px; }
.item .d { font-size: 12px; color: var(--muted); }
.item .t { font-size: 14px; font-weight: 500; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.summary div { display: grid; gap: 2px; }
.summary .k { font-size: 12px; color: var(--muted); }
.summary .v { font-size: 17px; font-weight: 600; }
details.help { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
details.help summary { cursor: pointer; padding: 14px 16px; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
details.help summary::-webkit-details-marker { display: none; }
details.help summary::after { content: "＋"; color: var(--muted); font-weight: 400; }
details.help[open] summary::after { content: "－"; }
dl.terms { margin: 0; padding: 0 16px 14px; display: grid; gap: 10px; }
dl.terms dt { font-weight: 600; font-size: 13.5px; }
dl.terms dd { margin: 2px 0 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); margin: 0 4px; line-height: 1.6; }
.empty { color: var(--muted); font-size: 14px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "month" "side" "flow"; }
  .flow { border-top: 1px solid var(--line); }
  .side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
/* Market flow: sector report card, rising themes, long-run facts (below the month grid) */
.flow { display: grid; gap: 28px; padding: 28px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); }
.flow h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.flow .lead { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
.fsec { display: grid; gap: 12px; min-width: 0; }
.sectors { display: grid; gap: 0; border-top: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) repeat(3, 64px); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.srow.head { font-size: 12px; color: var(--muted); padding: 6px 0; }
.srow.head span:nth-child(n+3) { text-align: right; }
.srow .nm { display: grid; gap: 1px; min-width: 0; }
.srow .nm b { font-weight: 600; }
.srow .nm small { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .v { text-align: right; font-weight: 500; }
.sbar { position: relative; height: 8px; }
.sbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.sbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; margin-left: 6px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.theme { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.theme h3 { margin: 0; font-size: 16px; font-weight: 700; }
.theme .one { margin: 0; font-size: 13.5px; line-height: 1.55; }
.theme .lbl2 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.theme ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.55; display: grid; gap: 3px; }
.cos { display: flex; flex-wrap: wrap; gap: 6px; }
.co { font-size: 12px; background: var(--side); border-radius: 6px; padding: 3px 7px; }
.co b { font-weight: 600; }
.risk { font-size: 12.5px; line-height: 1.55; background: var(--down-soft); border-radius: 8px; padding: 8px 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.fact { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 14px 16px; display: grid; gap: 4px; }
.fact .k { font-size: 12px; color: var(--muted); }
.fact .v { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.fact .d { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.disc { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }
@media (max-width: 600px) {
  .srow { grid-template-columns: minmax(0, 1fr) repeat(3, 56px); }
  .srow .sbar, .srow.head span:nth-child(2) { display: none; }
}

@media (max-width: 600px) {
  .flow { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 24px; }
  .bar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid { grid-auto-rows: minmax(64px, auto); }
  .dows div { text-align: center; padding: 0 0 6px; }
  .dnum { margin-right: auto; font-size: 14px; width: 26px; height: 26px; }
  .ev .lbl, .ev.extra, .tag { display: none; }
  .ev { justify-content: center; padding: 1px 2px; font-size: 11px; }
  .ev .val { margin-left: 0; }
  .ev .dot { display: none; }
  .ev.earn .enames { display: none; }
  .ev.earn .dot { display: inline-block; }
}
</style>
</head>
<body>
<div class="app">
  <main class="month">
    <div class="bar">
      <div class="titles">
        <h1 id="title"></h1>
        <div class="legend" aria-label="범례">
          <span><i class="bg-up"></i>오른 날</span>
          <span><i class="bg-down"></i>내린 날</span>
          <span><i class="bg-flat"></i>거의 그대로</span>
          <span><i class="bg-earn"></i>대형주 실적 발표</span>
          <span>날짜를 누르면 쉬운 해석이 나와요</span>
        </div>
      </div>
      <div class="seg" role="group" aria-label="달 이동">
        <button id="prev" type="button" aria-label="이전 달">‹</button>
        <button id="today" type="button">오늘</button>
        <button id="next" type="button" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="dows" id="dows"></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="side" id="side" aria-live="polite"></aside>
  <section class="flow" id="flow" aria-label="요즘 시장 흐름"></section>
</div>

<script>
function startCalendar() {
  const DAYS = window.MARKET_DAYS || {};
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const IDX = [["spx", "S&P 500"], ["ndx", "나스닥"], ["dji", "다우"]];
  const SHORT = { spx: "S&P", ndx: "나스닥", dji: "다우" };
  const ABOUT = { spx: "미국 대표 기업 500곳", ndx: "애플·엔비디아 같은 기술·성장주 중심", dji: "코카콜라·JP모건 같은 전통 대형주 30곳" };
  const keys = Object.keys(DAYS).sort();
  const tradeKeys = keys.filter((k) => DAYS[k].indices);
  const latest = keys[keys.length - 1];

  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = iso(now);
  let selected = latest || null;
  let view = latest ? { y: +latest.slice(0, 4), m: +latest.slice(5, 7) - 1 } : { y: now.getFullYear(), m: now.getMonth() };

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const STATS = window.MARKET_STATS?.indices || {};
  const SECTORS = window.MARKET_SECTORS?.sectors || [];
  const TRENDS = window.MARKET_TRENDS;
  const EARN = window.MARKET_EARNINGS || {};
  const WHEN = { pre: "장 시작 전 발표 · 한국 시간 그날 밤", after: "장 마감 후 발표 · 한국 시간 다음 날 새벽", unknown: "발표 시간 미정" };
  function earnRow(x) {
    const row = el("div", "erow");
    const top = el("div", "etop");
    top.append(el("b", null, x.name), el("span", "etk", x.symbol));
    row.append(top);
    if (x.what) row.append(el("div", "ewhat", x.what));
    row.append(el("div", "ewhen", WHEN[x.time] || WHEN.unknown));
    const usd = (v) => `${v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)}달러`;
    if (typeof x.eps === "number") {
      const r = el("div", "eres num");
      r.append(`주당순이익(EPS) ${usd(x.eps)}`);
      if (typeof x.surprise === "number" && typeof x.epsForecast === "number") {
        const good = x.surprise >= 0;
        r.append(" · ", el("span", good ? "up" : "down", `예상(${usd(x.epsForecast)})보다 ${Math.abs(x.surprise).toFixed(1)}% ${good ? "좋았어요" : "나빴어요"}`));
      }
      row.append(r);
    } else if (typeof x.epsForecast === "number") {
      row.append(el("div", "eres num", `예상 주당순이익(EPS) ${usd(x.epsForecast)}`));
    }
    return row;
  }
  const yearOf = (k) => k ? k.slice(0, 4) : "";
  const dateKo = (k) => { const [y, m, d] = k.split("-").map(Number); return `${y}년 ${m}월 ${d}일`; };

  /* ---------- full-history statistics (descriptive only) ---------- */
  // Share of all trading days whose absolute move was smaller than v.
  function smallerShare(st, v) {
    const q = st.absQuantiles, a = Math.abs(v);
    let i = 0; while (i < 100 && q[i + 1] <= a) i++;
    return i;
  }
  function historyPoints(k) {
    const st = STATS.spx, r = DAYS[k];
    if (!st || !r?.indices) return [];
    const spx = r.indices.spx.chg, a = Math.abs(spx), since = yearOf(st.start);
    const years = st.days / 252;
    const pts = [];
    const share = smallerShare(st, spx);
    if (a < 0.5) {
      pts.push(["▦", `하루 ±0.5% 안쪽 움직임은 ${since}년 이후 전체 거래일의 약 ${share}%예요. 가장 흔한, 평범한 날이에요.`]);
    } else {
      const t = [3, 2, 1, 0.5].find((x) => a >= x);
      const m = st.moves[String(t)];
      const per = spx > 0 ? m.upPerYear : m.downPerYear;
      const top = Math.max(1, 100 - share);
      const rank = top <= 25 ? `이날 움직임은 전체 거래일 중 상위 ${top}% 안에 드는 큰 편이에요.` : "이날 정도의 움직임은 꽤 흔한 크기예요.";
      pts.push(["▦", `${since}년 이후 S&P 500이 하루 ${t}% 이상 ${spx > 0 ? "오른" : "내린"} 날은 1년에 평균 ${per}번꼴이에요. ${rank}`]);
    }
    const s = streak(k), d = dir(spx);
    if (s >= 2 && s <= 10 && d !== "flat") {
      const cnt = st.streaks[d === "up" ? "up" : "down"][s - 2];
      pts.push(["↻", `${s}일 이상 연속 ${d === "up" ? "상승" : "하락"}은 ${since}년 이후 ${cnt.toLocaleString()}번 있었어요(1년에 약 ${(cnt / years).toFixed(1)}번).`]);
    }
    const dd = r.indices.spx.dd;
    if (typeof dd === "number") {
      if (dd >= 0) pts.push(["★", "이날 S&P 500은 역대 최고치를 새로 썼어요."]);
      else {
        const zone = dd <= -20 ? "고점보다 20% 넘게 빠진 '약세장' 구간이에요." : dd <= -10 ? "고점보다 10% 넘게 빠진 '조정' 구간이에요." : "10% 이상 빠지면 '조정', 20% 이상이면 '약세장'이라고 불러요.";
        pts.push(["⌂", `이날 S&P 500은 역대 최고치보다 ${Math.abs(dd).toFixed(1)}% 낮은 위치였어요. ${zone}`]);
      }
    }
    if (a >= 2) pts.push(["!", `참고로 역대 가장 크게 내린 날은 ${dateKo(st.worst.date)}(${pct(st.worst.chg)}), 가장 크게 오른 날은 ${dateKo(st.best.date)}(${pct(st.best.chg)})이에요.`]);
    return pts;
  }
  const pct = (v) => (typeof v === "number" ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + "%" : "–");
  const dir = (v) => (v >= 0.1 ? "up" : v <= -0.1 ? "down" : "flat");
  const fmt = (v) => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const label = (k) => { const [y, m, d] = k.split("-").map(Number); return `${m}월 ${d}일 (${DOW[new Date(y, m - 1, d).getDay()]})`; };

  /* ---------- plain-language helpers ---------- */
  // How big a one-day index move is, in everyday words.
  function size(v) {
    const a = Math.abs(v);
    if (a < 0.1) return "거의 그대로";
    if (a < 0.5) return "조금";
    if (a < 1) return "꽤";
    if (a < 2) return "크게";
    return "아주 크게";
  }
  function moveWord(v) {
    const s = size(v);
    if (s === "거의 그대로") return "거의 변화 없었어요";
    return `${s} ${v > 0 ? "올랐어요" : "내렸어요"}`;
  }
  function tagWord(v) {
    const a = Math.abs(v);
    if (a < 0.1) return "보합";
    if (a >= 2) return v > 0 ? "급등" : "급락";
    return `${size(v)} ${v > 0 ? "오름" : "내림"}`;
  }
  function streak(k) {
    const i = tradeKeys.indexOf(k);
    const d = dir(DAYS[k].indices.spx.chg);
    if (d === "flat") return 0;
    let n = 1;
    for (let j = i - 1; j >= 0 && dir(DAYS[tradeKeys[j]].indices.spx.chg) === d; j--) n++;
    return n;
  }
  function avgMove(k, n = 20) {
    const i = tradeKeys.indexOf(k);
    const prev = tradeKeys.slice(Math.max(0, i - n), i);
    if (prev.length < 5) return null;
    return prev.reduce((s, x) => s + Math.abs(DAYS[x].indices.spx.chg), 0) / prev.length;
  }
  function koreaTime(k) {
    const [y, m, d] = k.split("-").map(Number);
    const close = new Date(Date.UTC(y, m - 1, d, 20)); // 16:00 EDT; refined below for EST
    const nyHour = +new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", hourCycle: "h23" }).format(close);
    close.setUTCHours(close.getUTCHours() + (16 - nyHour));
    const kst = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "numeric", hour12: false }).formatToParts(close);
    const p = Object.fromEntries(kst.map((x) => [x.type, x.value]));
    return `한국 시간 ${p.month}월 ${p.day}일(${p.weekday}) 새벽 ${p.hour}시`;
  }

  function explainDay(k) {
    const r = DAYS[k], ix = r.indices;
    const spx = ix.spx.chg, ndx = ix.ndx.chg, dji = ix.dji.chg;
    const headline = dir(spx) === "flat"
      ? `미국 대표 기업 500곳의 주가를 묶은 S&P 500이 하루 동안 거의 변화가 없었어요(${pct(spx)}).`
      : `미국 대표 기업 500곳의 주가를 묶은 S&P 500이 하루 동안 ${Math.abs(spx).toFixed(2)}% ${spx > 0 ? "올랐어요" : "내렸어요"}. '${size(spx)}' ${spx > 0 ? "오른" : "내린"} 날이에요.`;
    const points = [];

    const avg = avgMove(k);
    if (avg != null) {
      const ratio = Math.abs(spx) / avg;
      const feel = ratio < 0.6 ? "평소보다 잔잔한 하루였어요" : ratio > 1.6 ? "평소보다 크게 출렁인 하루였어요" : "평소와 비슷한 크기의 움직임이에요";
      points.push(["≈", `최근 20거래일 동안 S&P 500은 하루 평균 ±${avg.toFixed(2)}% 정도 움직였어요. 그에 비하면 ${feel}.`]);
    }

    const s = streak(k);
    if (s >= 2) points.push([dir(spx) === "up" ? "↑" : "↓", `${s}거래일 연속 ${dir(spx) === "up" ? "올랐어요" : "내렸어요"}.`]);

    const dn = dir(ndx), dd = dir(dji);
    if (dn !== "flat" && dd !== "flat" && dn !== dd) {
      points.push(["⇅", `기술주 중심인 나스닥은 ${dn === "up" ? "오르고" : "내리고"}, 전통 대형주 중심인 다우는 ${dd === "up" ? "올라서" : "내려서"} 업종별로 분위기가 엇갈렸어요.`]);
    } else if (Math.abs(ndx - dji) >= 0.7) {
      const techStronger = ndx > dji;
      const bothDown = ndx < 0 && dji < 0;
      const [hi, lo] = techStronger ? [`나스닥(${pct(ndx)})`, `다우(${pct(dji)})`] : [`다우(${pct(dji)})`, `나스닥(${pct(ndx)})`];
      const hiSubj = hi + (techStronger ? "은" : "는");
      points.push(["⇅", bothDown
        ? `${hiSubj} ${lo}보다 덜 내렸어요. ${techStronger ? "전통 대형주 쪽" : "기술·성장주 쪽"} 하락이 더 컸던 날이에요.`
        : `${hiSubj} ${lo}보다 더 힘이 좋았어요. ${techStronger ? "기술·성장주가" : "전통 대형주가"} 상대적으로 강했던 날이에요.`]);
    } else {
      points.push(["＝", `나스닥(${pct(ndx)})과 다우(${pct(dji)})가 비슷한 방향으로 움직였어요. 업종 가리지 않고 시장 전체 분위기가 같았던 날이에요.`]);
    }

    const djiPts = Math.round(ix.dji.close - ix.dji.prev);
    if (Math.abs(djiPts) >= 100) {
      points.push(["ⓘ", `뉴스에서 "다우 ${Math.abs(djiPts).toLocaleString()}포인트 ${djiPts > 0 ? "상승" : "하락"}"이라고 하면 이날 얘기예요. 포인트는 지수 숫자가 변한 크기이고, 비율로 보면 ${pct(dji)}예요.`]);
    }

    points.push(["◷", `이 결과는 뉴욕 시간 오후 4시 장 마감 기준이에요. ${koreaTime(k)}에 확정됐어요.`]);
    return { headline, points };
  }

  function explainMonth(st, y, m) {
    const ongoing = y === now.getFullYear() && m === now.getMonth();
    const r = st.ret.spx;
    const tone = Math.abs(r) < 1 ? (ongoing ? "거의 제자리인" : "거의 제자리였던") : Math.abs(r) < 3 ? (r > 0 ? "조금 오른" : "조금 내린") : r > 0 ? "많이 오른" : "많이 내린";
    const order = IDX.map(([k, n]) => [n, st.ret[k]]).sort((a, b) => b[1] - a[1]);
    const best = order[0], worst = order[order.length - 1];
    let text = `${m + 1}월은 ${ongoing ? "지금까지 " : ""}S&P 500 기준 ${tone} 한 달${ongoing ? "이에요" : "이었어요"} (${pct(r)}).`;
    const subj = (name) => name + (name === "다우" ? "가" : "이"); // S&P 500(오백)·나스닥 end in a final consonant
    if (best[1] - worst[1] >= 2) text += ` 세 지수 중 ${subj(best[0])} 가장 강했고(${pct(best[1])}), ${subj(worst[0])} 가장 약했어요(${pct(worst[1])}).`;
    return text;
  }

  function monthStats(y, m) {
    const prefix = `${y}-${pad(m + 1)}`;
    const ks = tradeKeys.filter((k) => k.startsWith(prefix));
    if (!ks.length) return null;
    const first = DAYS[ks[0]].indices, last = DAYS[ks[ks.length - 1]].indices;
    const ret = {};
    IDX.forEach(([k]) => { ret[k] = (last[k].close / first[k].prev - 1) * 100; });
    return { ret, up: ks.filter((k) => DAYS[k].verdict === "up").length, down: ks.filter((k) => DAYS[k].verdict === "down").length, n: ks.length };
  }

    const dl = el("dl", "terms");
    [
      ["지수", "여러 회사 주가를 하나로 묶은 점수예요. 지수가 올랐다는 건 묶인 회사들 주가가 평균적으로 올랐다는 뜻이에요."],
      ["S&P 500", "미국 대표 기업 500곳을 묶은 지수예요. '미국 증시가 올랐다/내렸다'고 할 때 보통 이걸 기준으로 봐요."],
      ["나스닥", "애플, 엔비디아, 마이크로소프트처럼 기술·성장 기업이 많은 지수예요. 다른 지수보다 크게 출렁이는 편이에요."],
      ["다우", "미국 전통 대형주 30곳으로 만든 가장 오래된 지수예요. 뉴스에서 '포인트'로 자주 말해요."],
      ["종가", "그날 장이 끝날 때(뉴욕 오후 4시)의 최종 가격이에요. 이 캘린더의 숫자는 모두 종가 기준이에요."],
      ["등락률", "전날 종가와 비교해 몇 % 올랐는지(+) 내렸는지(−)예요. +1%면 100만 원어치가 하루 새 101만 원이 된 셈이에요."],
      ["보합", "거의 변화가 없는 상태예요. 이 캘린더에서는 S&P 500 등락이 ±0.1% 안쪽일 때 보합으로 봐요."],
      ["급등·급락", "하루에 2% 넘게 움직인 날이에요. 1년에 몇 번 없는, 시장이 크게 놀란 날이에요."],
      ["휴장", "미국 공휴일이라 증시가 열리지 않은 날이에요. 토·일요일도 열리지 않아요."],
      ["실적 발표", "상장 회사가 3개월마다 매출과 이익을 공개하는 날이에요. 결과가 시장 예상과 얼마나 다른지에 따라 주가가 크게 움직여요."],
      ["EPS (주당순이익)", "회사가 번 순이익을 주식 수로 나눈 값이에요. '주식 1주당 얼마를 벌었나'를 뜻해요."],
      ["어닝 서프라이즈", "실제 실적이 전문가들의 예상보다 좋게 나온 것이에요. 반대로 나쁘게 나오면 '어닝 쇼크'라고 해요. 다만 예상보다 좋아도 주가가 내릴 때가 있어요."],
      ["빨강·파랑", "한국 증시 앱처럼 오르면 빨강, 내리면 파랑이에요. 미국 앱은 반대로 오르면 초록, 내리면 빨강을 써요."],
    ].forEach(([t, d]) => { dl.append(el("dt", null, t), el("dd", null, d)); });
    help.append(dl);
    side.append(help);

    const upd = rec?.updatedAt ? new Date(rec.updatedAt).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" }) : null;
    side.append(el("p", "foot", `데이터: Yahoo Finance 종가 · 평일 아침 7시(KST) 자동 갱신${upd ? ` · 마지막 갱신 ${upd}` : ""}. 뉴스 해석은 Claude가 기사를 찾아 요약한 것이고, 나머지 해석은 숫자로 자동 생성돼요. 투자 조언이 아닙니다.`));
  }

  function render() { renderGrid(); renderSide(); }
  // When the details stack under the grid (phones, narrow windows), bring them into view after a tap.
  function revealDetail() {
    if (!matchMedia("(max-width: 1100px)").matches) return;
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("side").scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  }
  const move = (delta) => { const d = new Date(view.y, view.m + delta, 1); view = { y: d.getFullYear(), m: d.getMonth() }; render(); };
  document.getElementById("prev").addEventListener("click", () => move(-1));
  document.getElementById("next").addEventListener("click", () => move(1));
  document.getElementById("today").addEventListener("click", () => { view = { y: now.getFullYear(), m: now.getMonth() }; render(); });
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1); });

  /* ---------- below the grid: sectors, rising themes, long-run facts ---------- */
  function renderFlow() {
    const flow = document.getElementById("flow");
    flow.replaceChildren();
    const head = (title, lead) => { const h = el("div"); h.append(el("h2", null, title)); if (lead) h.append(el("p", "lead", lead)); return h; };

    if (SECTORS.length) {
      const sec = el("section", "fsec");
      sec.append(head("업종 성적표", `미국 주식을 업종별로 묶은 ETF의 최근 수익률이에요. 최근 1개월 기준으로 줄 세웠어요. (${window.MARKET_SECTORS.asOf ? label(window.MARKET_SECTORS.asOf) + " 종가 기준" : ""})`));
      const rows = [...SECTORS].sort((a, b) => (b.m1 ?? -999) - (a.m1 ?? -999));
      const maxAbs = Math.max(...rows.map((r) => Math.abs(r.m1 || 0)), 1);
      const table = el("div", "sectors num");
      const hr = el("div", "srow head");
      ["업종", "최근 1개월", "1주", "1개월", "3개월"].forEach((t) => hr.append(el("span", null, t)));
      table.append(hr);
      rows.forEach((r, i) => {
        const row = el("div", "srow");
        const nm = el("span", "nm");
        const b = el("b", null, r.name);
        if (i < 3) b.append(el("span", "badge up", "요즘 강세"));
        if (i >= rows.length - 3) b.append(el("span", "badge down", "요즘 약세"));
        nm.append(b, el("small", null, `${r.about} · ${r.ticker}`));
        const bar = el("span", "sbar"); const fill = el("i", "bg-" + dir(r.m1 || 0));
        const w = (Math.abs(r.m1 || 0) / maxAbs) * 50;
        fill.style.width = w + "%"; fill.style[r.m1 >= 0 ? "left" : "right"] = "50%";
        bar.append(fill);
        row.append(nm, bar, el("span", "v " + dir(r.w1 || 0), pct(r.w1)), el("span", "v " + dir(r.m1 || 0), pct(r.m1)), el("span", "v " + dir(r.m3 || 0), pct(r.m3)));
        table.append(row);
      });
      sec.append(table);
      flow.append(sec);
    }

    const tsec = el("section", "fsec");
    const themes = TRENDS?.themes || [];
    tsec.append(head("요즘 떠오르는 테마", themes.length
      ? `Claude가 최근 기사와 위 업종 수익률을 바탕으로 정리한, 요즘 시장에서 많이 이야기되는 흐름이에요.${TRENDS.updatedAt ? " " + new Date(TRENDS.updatedAt).toLocaleDateString("ko-KR") + " 정리." : ""}`
      : "매주 토요일 아침, Claude가 최근 기사와 업종 수익률을 바탕으로 요즘 많이 이야기되는 테마를 정리해 여기에 채워요."));
    if (themes.length) {
      const grid = el("div", "themes");
      themes.forEach((t) => {
        const c = el("article", "theme");
        c.append(el("h3", null, t.name || ""));
        if (t.oneLine) c.append(el("p", "one", t.oneLine));
        if (t.why?.length) { const w = el("div"); w.append(el("div", "lbl2", "왜 주목받나요?")); const ul = el("ul"); t.why.forEach((x) => ul.append(el("li", null, x))); w.append(ul); c.append(w); }
        if (t.companies?.length) {
          const w = el("div"); w.append(el("div", "lbl2", "자주 언급되는 기업"));
          const cos = el("div", "cos");
          t.companies.forEach((co) => { const s = el("span", "co"); s.append(el("b", null, co.name), ` ${co.ticker ? "(" + co.ticker + ") " : ""}${co.what || ""}`); cos.append(s); });
          w.append(cos); c.append(w);
        }
        if (t.risks) c.append(el("div", "risk", "주의할 점: " + t.risks));
        const links = (t.sources || []).filter((u) => /^https:\/\//.test(u));
        if (links.length) {
          const src = el("div", "src", "출처 ");
          links.forEach((u, i) => { const a = el("a", null, new URL(u).hostname.replace(/^www\./, "")); a.href = u; a.target = "_blank"; a.rel = "noopener"; if (i) src.append(" · "); src.append(a); });
          c.append(src);
        }
        grid.append(c);
      });
      tsec.append(grid);
    }
    tsec.append(el("p", "disc", "특정 종목을 사거나 팔라는 추천이 아니에요. 요즘 시장에서 무엇이 이야기되는지 공부용으로 정리한 내용이고, 투자 판단과 책임은 본인에게 있어요."));
    flow.append(tsec);

    const st = STATS.spx;
    if (st) {
      const fsec = el("section", "fsec");
      fsec.append(head("숫자로 보는 미국 증시", `S&P 500의 ${yearOf(st.start)}년부터 지금까지 ${st.days.toLocaleString()}거래일을 분석했어요. 주가 기준(배당 제외)이에요.`));
      const facts = el("div", "facts");
      const fact = (k, v, d, cls) => { const f = el("div", "fact"); f.append(el("span", "k", k), el("span", "v num " + (cls || ""), v), el("span", "d", d)); facts.append(f); };
      fact("오른 날의 비율", `${st.upShare}%`, "하루하루는 거의 동전 던지기에 가까워요. 오른 날이 조금 더 많아요.");
      fact("하루 ±1% 넘게 움직인 날", `연 ${(st.moves["1"].upPerYear + st.moves["1"].downPerYear).toFixed(0)}번`, "1% 넘게 출렁이는 날은 한 달에 4번 정도로 흔한 일이에요.");
      fact("역대 최악의 하루", pct(st.worst.chg), `${dateKo(st.worst.date)}${st.worst.date === "1987-10-19" ? " '블랙 먼데이'" : ""}`, "down");
      fact("역대 최고의 하루", pct(st.best.chg), dateKo(st.best.date), "up");
      if (st.hold["1y"]) fact("1년 들고 있었을 때 손실 확률", `${st.hold["1y"].lossShare}%`, `아무 날이나 사서 1년 뒤에 팔았다면 ${Math.round(100 / st.hold["1y"].lossShare)}번 중 1번꼴로 손해였어요.`);
      if (st.hold["10y"]) fact("10년 들고 있었을 때 손실 확률", `${st.hold["10y"].lossShare}%`, "보유 기간이 길수록 손실로 끝난 경우가 크게 줄었어요.");
      fact("역대 최고치", fmt(st.ath.close), `${dateKo(st.ath.date)} 종가`);
      fsec.append(facts, el("p", "disc", "모두 과거 기록이에요. 과거에 그랬다고 앞으로도 그렇다는 보장은 없어요."));
      flow.append(fsec);
    }
  }

  renderFlow();
  render();
}
// data.js changes every morning; skip the browser cache so the newest closes always show.
const dataScript = document.createElement("script");
dataScript.src = "data.js?v=" + Date.now();
dataScript.onload = dataScript.onerror = startCalendar;
document.head.append(dataScript);
</script>
</body>
